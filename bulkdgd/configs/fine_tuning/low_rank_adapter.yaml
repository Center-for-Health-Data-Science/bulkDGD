# Adapt a zero-initialized low-rank residual on the mean head.

fine_tuning_scheme: low_rank_adapter
seed: 37
deterministic_algorithms: true
n_epochs: 50

data_loader_options:
  batch_size: 16
  shuffle: true

target_representation_options:
  config: null

replay_options:
  replay_ratio: 1.0
  stratify_by: tissue

anchoring_options:
  l2_sp: 1.0
  functional: 1.0

checkpoint_options:
  resume: false
  every_n_epochs: 1

early_stopping_options:
  patience: 10
  min_delta: 0.0

reporting_options:
  fixed_panels: true

scheme_options:
  rank: 8
  alpha: 8.0
  dropout: 0.0
  learning_rate: 0.0001
