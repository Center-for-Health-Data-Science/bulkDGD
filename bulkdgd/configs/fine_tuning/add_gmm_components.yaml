# Append anchored cancer components while keeping the decoder and all
# parent component parameters fixed.

fine_tuning_scheme: add_gmm_components
seed: 37
deterministic_algorithms: true
n_epochs: 50

data_loader_options:
  batch_size: 16
  shuffle: true

target_representation_options:
  config: null

replay_options:
  replay_ratio: 1.0
  stratify_by: null

anchoring_options:
  l2_sp: 0.0
  functional: 0.0

checkpoint_options:
  resume: false
  every_n_epochs: 1

early_stopping_options:
  patience: 10
  min_delta: 0.0

reporting_options:
  fixed_panels: true

scheme_options:
  component_fit_seed: 37
  n_new_components: 4
  new_component_weight: 0.10
  initialization: kpp
  max_iter: 100
  tol: 0.00001
  reg_covar: 0.000001
  outer_iterations: 1
