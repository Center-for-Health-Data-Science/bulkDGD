# Adapt only the dispersion parameters with healthy replay.

fine_tuning_scheme: dispersion_only
seed: 37
deterministic_algorithms: true
n_epochs: 50

data_loader_options:
  batch_size: 16
  shuffle: true

target_representation_options:
  config: null

replay_options:
  replay_ratio: 1.0
  stratify_by: tissue

anchoring_options:
  l2_sp: 0.0
  functional: 0.0

checkpoint_options:
  resume: false
  every_n_epochs: 1

early_stopping_options:
  patience: 10
  min_delta: 0.0

reporting_options:
  fixed_panels: true

scheme_options:
  learning_rate: 0.0001
  dispersion_anchor: 1.0
