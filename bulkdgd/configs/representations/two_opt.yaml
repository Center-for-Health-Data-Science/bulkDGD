# Configuration file specifying the options to get the representations
# with two rounds of optimization.


#######################################################################


# Set the name of the optimization scheme the configuration refers to.
#
# Type: str.
#
# Options:
# - 'two_opt' for the optimization scheme with two rounds of
#   optimization.
#
# 'two_opt' is currently the only scheme. A 'one_opt' scheme, with a
# single round of optimization and no selection step between rounds,
# was retired.
scheme_type: two_opt


#######################################################################


# Set the type of latent space.
#
# Type: str.
#
# Options:
# - 'lgmm' for the legacy Gaussian mixture model implementation.
# - 'tgmm' for the new Gaussian mixture model implementation.
latent_type: tgmm


#######################################################################


# Set how many representations to initialize per sample per component
# of the Gaussian mixture model.
#
# Type: int.
n_rep_per_comp: 1


#######################################################################


# Set the options for the data loader. They are passed to the
# 'torch.utils.data.DataLoader' constructor.
data_loader_options:

  # Set how many samples per batch to load.
  #
  # Type: int.
  batch_size: 8


#######################################################################


# Set the options for reporting during the optimization.
reporting_options:

  # Set the options to report the loss.
  loss:

    # Set the options for the latent space loss.
    latent:

      # Set the method used to normalize the loss when reporting it
      # per epoch.
      #
      # Type: str.
      #
      # Options:
      # - 'none' means that the loss will not be normalized.
      # - 'n_samples' means that the loss will be normalized by the
      #   number of samples.
      norm_type: n_samples

    #-----------------------------------------------------------------#

    # Set the options for the reconstruction loss.
    decoder:
      
      # Set the method used to normalize the loss when reporting it
      # per epoch.
      #
      # Type: str.
      #
      # Options:
      # - 'none' means that the loss will not be normalized.
      # - 'n_samples' means that the loss will be normalized by the
      #   number of samples.
      norm_type: n_samples

    #-----------------------------------------------------------------#

    # Set the options for the total loss.
    total:

      # Set the method used to normalize the loss when reporting it
      # per epoch.
      #
      # Type: str.
      #
      # Options:
      # - 'none' means that the loss will not be normalized.
      # - 'n_samples' means that the loss will be normalized by the
      #   number of samples.
      norm_type: n_samples


#######################################################################


# Set the options for the optimization scheme.
scheme_options:

  # Set the options for the first optimization round.
  optimization_1:

    # Set the number of epochs the optimization should be run for.
    #
    # Type: int.
    epochs: 10

    # Set the type of noise to inject into the representations while
    # they are being optimized, and the options for that noise.
    #
    # This is the same perturbation, under the same options, that the
    # decoder's training applies to its own representations. Unlike
    # training's, it is OFF unless set here: the decoder is fixed when
    # representations are found, and a representation is an inference
    # about a sample, so a configuration that says nothing about noise
    # finds the representation it would have found before this option
    # existed.
    #
    # Each round is annealed over its OWN epochs, and each is set
    # separately - the first round explores from many candidates and
    # the second refines the one that won, so they need not be
    # perturbed by the same amount.
    #
    # Uncomment to enable.
    #
    # Type: str. Options: 'gaussian'.
    #noise_type: gaussian
    #noise_options:
    #  # The base scale of the noise. Zero disables the injection.
    #  scale: 0.1
    #  # The multipliers the scale is cosine-annealed between, from
    #  # this round's first epoch to its last.
    #  start: 1.0
    #  end: 0.01
    #  # The probability defining the hypersphere the noise is
    #  # normalized against, so that a scale means the same thing
    #  # whatever the dimensionality of the latent space.
    #  within_radius_prob: 0.95
    #  # A final multiplier on the noise.
    #  gain: 1.0

    # Set the options for the optimizer.
    optimizer:

      # Set the name of the optimizer to be used.
      #
      # Type: str.
      #
      # Options:
      # - 'adam' for the Adam optimizer.
      # - 'adamw' for the AdamW optimizer.
      optimizer_type: adam

      # Set the options for the optimizer.
      optimizer_options:

        # Set the learning rate.
        #
        # Type: float.
        lr: 0.01

        # Set the weight decay.
        #
        # Type: float.
        weight_decay: 0.0

        # Set the betas.
        #
        # Type: list of float.
        betas: [0.5, 0.9]


  #-------------------------------------------------------------------#


  # Set the options for the second optimization round.
  optimization_2:

    # Set the number of epochs the optimization should be run for.
    #
    # Type: int.
    epochs: 50

    # Set the noise for this round, independently of the first. See
    # 'optimization_1' above for what the options mean. Off unless set.
    #
    # Type: str. Options: 'gaussian'.
    #noise_type: gaussian
    #noise_options:
    #  scale: 0.1
    #  start: 1.0
    #  end: 0.01
    #  within_radius_prob: 0.95
    #  gain: 1.0

    # Set the options for the optimizer.
    optimizer:

      # Set the name of the optimizer to be used.
      #
      # Type: str.
      #
      # Options:
      # - 'adam' for the Adam optimizer.
      # - 'adamw' for the AdamW optimizer.
      optimizer_type: adam

      # Set the options for the optimizer.
      optimizer_options:

        # Set the learning rate.
        #
        # Type: float.
        lr: 0.01

        # Set the weight decay.
        #
        # Type: float.
        weight_decay: 0.0

        # Set the betas.
        #
        # Type: list of float.
        betas: [0.5, 0.9]
