# Configuration file specifying the options to get the representations
# with two rounds of optimization, run once per initialization seed.


#######################################################################


# Set the name of the optimization scheme the configuration refers to.
#
# Type: str.
#
# Options:
# - 'two_opt' for the optimization scheme with two rounds of
#   optimization.
# - 'two_opt_multiseed' for the same scheme run once per seed, keeping
#   every seed's representation instead of one.
#
# WHAT THE SEED DOES, AND WHY RUNNING SEVERAL IS WORTH THE TIME. The
# seed places the candidate representations drawn from the components
# of the Gaussian mixture model, and nothing else: the two descents and
# the selection between them are deterministic once the candidates are
# fixed. Two seeds therefore end at two different local optima, and the
# genes called from them differ by roughly a fifth. Neither run can say
# which of the two is right, but the calls the seeds AGREE on are
# measurably better than the calls only one of them makes, so the
# agreement is worth producing deliberately.
#
# The outputs differ from 'two_opt': one representation per sample PER
# SEED, and a table of losses that 'two_opt' has no counterpart for.
scheme_type: two_opt_multiseed


#######################################################################


# Set the type of latent space.
#
# Type: str.
#
# Options:
# - 'lgmm' for the legacy Gaussian mixture model implementation.
# - 'tgmm' for the new Gaussian mixture model implementation.
#
# The seeded initialization exists only for 'tgmm'. The legacy
# implementation places its candidates by a deterministic rule that
# takes no seed, so every seed would return the same representation and
# the agreement between them would measure nothing.
latent_type: tgmm


#######################################################################


# Set how many representations to initialize per sample per component
# of the Gaussian mixture model.
#
# Type: int.
n_rep_per_comp: 1


#######################################################################


# Set the options for the data loader. They are passed to the
# 'torch.utils.data.DataLoader' constructor.
data_loader_options:

  # Set how many samples per batch to load.
  #
  # Type: int.
  batch_size: 8

  # Whether to shuffle the samples.
  #
  # Type: bool.
  #
  # Leave this false. The losses are written one row per sample and
  # are placed by the samples' indices, so shuffling does not corrupt
  # them, but the seeds are compared to each other and to standalone
  # runs, and there is no reason to introduce an ordering difference
  # into a comparison whose whole point is that nothing else differs.
  shuffle: false


#######################################################################


# Set the options for reporting during the optimization.
reporting_options:

  # Set the options to report the loss.
  loss:

    # Set the options for the latent space loss.
    latent:

      # Set the method used to normalize the loss when reporting it
      # per epoch.
      #
      # Type: str.
      #
      # Options:
      # - 'none' means that the loss will not be normalized.
      # - 'n_samples' means that the loss will be normalized by the
      #   number of samples.
      norm_type: n_samples

    #-----------------------------------------------------------------#

    # Set the options for the reconstruction loss.
    decoder:

      # Type: str. Options: 'none', 'n_samples'.
      norm_type: n_samples

    #-----------------------------------------------------------------#

    # Set the options for the total loss.
    total:

      # Type: str. Options: 'none', 'n_samples'.
      norm_type: n_samples


#######################################################################


# Set the options for the optimization scheme.
scheme_options:

  # Set how the loss is reduced over the candidates when it is
  # backpropagated.
  #
  # Type: str. Options: 'mean', 'sum'.
  #
  # LEAVE THIS AS 'sum' FOR THIS SCHEME. Under 'sum' the gradient of a
  # candidate is its own and does not depend on how many candidates
  # share the tensor, which is what makes a seed's run here identical
  # to the same seed run on its own. Under 'mean' every gradient is
  # divided by the number of candidates, and the comparison this scheme
  # exists to make would no longer be against anything.
  loss_reduction_type: sum

  #-------------------------------------------------------------------#

  # Set how the candidate representations are placed.
  initialization:

    # The seeds to run, one representation per sample coming back from
    # each.
    #
    # Type: list of int.
    #
    # They must be distinct: two runs from one seed give the same
    # representation, and their agreement measures nothing. The scheme
    # refuses a repeated seed rather than reporting a perfect agreement
    # that is an artefact of the configuration.
    #
    # Each seed is run at the same tensor shape a standalone run uses,
    # in sequence, so that reproducing a standalone run is a property
    # of the arithmetic and not a hope about which kernel the linear
    # algebra library picks for a larger multiply.
    seeds: [7, 13, 42]

  #-------------------------------------------------------------------#

  # Set the options for the first optimization round.
  optimization_1:

    # Set the number of epochs the optimization should be run for.
    #
    # Type: int.
    epochs: 10

    # Set the optimizer.
    #
    # NOTE the flat layout. '_get_representations_two_opt' reads
    # 'optimizer_type' and 'optimizer_options' directly under the
    # round, not nested inside an 'optimizer' block. The shipped
    # 'two_opt.yaml' nests them, which is why loading it warns that
    # 'optimizer_type' was not found and falls back to the default.
    #
    # Type: str. Options: 'adam', 'adamw'.
    optimizer_type: adamw

    # Set the options for the optimizer.
    optimizer_options:

      # Type: float.
      lr: 0.01

      # Type: float.
      weight_decay: 0.0

      # Type: list of float.
      betas: [0.9, 0.999]


  #-------------------------------------------------------------------#


  # Set the options for the second optimization round.
  optimization_2:

    # Set the number of epochs the optimization should be run for.
    #
    # Type: int.
    epochs: 50

    # Set the optimizer.
    #
    # NOTE the flat layout. '_get_representations_two_opt' reads
    # 'optimizer_type' and 'optimizer_options' directly under the
    # round, not nested inside an 'optimizer' block. The shipped
    # 'two_opt.yaml' nests them, which is why loading it warns that
    # 'optimizer_type' was not found and falls back to the default.
    #
    # Type: str. Options: 'adam', 'adamw'.
    optimizer_type: adamw

    # Set the options for the optimizer.
    optimizer_options:

      # Type: float.
      lr: 0.01

      # Type: float.
      weight_decay: 0.0

      # Type: list of float.
      betas: [0.9, 0.999]
